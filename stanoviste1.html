<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏠 Domček sovy - Stanovisko 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #8b5cf6;
      color: white;
      text-align: center;
      padding: 40px;
      margin: 0;
    }
    h1 { color: #fbbf24; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    select {
      font-size: 20px;
      padding: 10px;
      margin: 20px 0;
      border-radius: 10px;
      border: 2px solid #fbbf24;
      min-width: 280px;
    }
    button {
      font-size: 20px;
      padding: 15px 30px;
      margin: 10px;
      background: #f59e0b;
      border: none;
      border-radius: 15px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover { background: #fbbf24; transform: scale(1.05); }
    button:disabled { background: #666; cursor: not-allowed; transform: none; }
    #status {
      margin-top: 20px;
      font-size: 18px;
      padding: 15px;
      border-radius: 10px;
      min-height: 80px;
    }
    .success { background: #10b981; }
    .error   { background: #ef4444; }
    .loading { background: #3b82f6; }
  </style>
</head>
<body>
  <h1>🏠 Domček sovy</h1>
  <p>Vyber si anagramy a dokonči úlohu s písmenkami!</p>

  <p>📚 Anagramy pre prvákov</p>

  <br>
  <button onclick="startGame()">🎮 Spustiť hru</button>
  <br><br>
  <button id="finishBtn" onclick="finishStation()">✅ Dokončil som úlohu</button>

  <div id="status"></div>

  <script>
    "use strict";  // pomôže odhaliť chyby

    const API = "https://script.google.com/macros/s/AKfycbx0t_2q7ohFvF4ZvTDEGEklEP6kNf5tFkAL89rb9ug2A5CV_a7XVMoOTyKeGjBNqjTY/exec";

    function startGame() {
  const link = "https://wordwall.net/resource/109553939";
  window.open(link, "_blank");
  showStatus("🕹️ Hra otvorená v novej karte. Po dokončení klikni ✅ nižšie!", "loading");
}

    function showStatus(msg, className = "") {
      const el = document.getElementById("status");
      if (el) {
        el.innerHTML = msg;
        el.className = className;
      }
    }

    function finishStation() {
      const stationId = 1;
      const statusEl = document.getElementById("status");
      const btn = document.getElementById("finishBtn");
      if (!statusEl || !btn) return;

      // visited ako pole (spoľahlivejšie ako Set)
      let visited = JSON.parse(localStorage.getItem("visitedStations") || "[]");
      if (!Array.isArray(visited)) visited = [];

      if (!visited.includes(stationId)) {
        visited.push(stationId);
        localStorage.setItem("visitedStations", JSON.stringify(visited));
      }

      let playerName = localStorage.getItem("playerName");
      if (!playerName) {
        playerName = prompt("Zadaj svoje meno:", "Hráč") || "Hráč";
        localStorage.setItem("playerName", playerName);
      }

      let playerId = localStorage.getItem("playerId");
      if (!playerId) {
        playerId = "hrac_" + Date.now();
        localStorage.setItem("playerId", playerId);
      }

      const payload = {
        name: playerName,
        playerId: playerId,
        station: stationId,
        score: visited.length
      };

      const url = API + "?" + new URLSearchParams(payload).toString();

      showStatus("📤 Odosielam dáta do Google Sheets...", "loading");
      btn.disabled = true;
      btn.textContent = "Odosiela sa...";

      fetch(url, { method: "GET", mode: "no-cors" })
        .then(() => {
          // no-cors → nemôžeme čítať odpoveď, predpokladáme OK
          showStatus(
            `✅ ÚLOHA DOKONČENÁ!<br><strong>${playerName}</strong><br>Stanovisko ${stationId} • Navštívené: ${visited.length}`,
            "success"
          );

          // označíme stanovištia
          visited.forEach(id => {
            localStorage.setItem(`station_${id}`, "completed");
          });

          setTimeout(() => {
            if (confirm("Vrátiť sa na mapu?")) {
              window.location.href = "index.html";
            }
            btn.disabled = false;
            btn.textContent = "✅ Dokončil som úlohu";
          }, 2200);
        })
        .catch(err => {
          console.error("Fetch error:", err);
          showStatus(`❌ Chyba: ${err.message || "neznáma"}<br>Skús znova (F12 pre detaily)`, "error");
          btn.disabled = false;
          btn.textContent = "✅ Dokončil som úlohu";
        });
    }

    // Ak chceš debug → odkomentuj
    // console.log("Skript načítaný OK");
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 Stanovisko 3 - Prázdne</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 40px;
      margin: 0;
    }
    h1 { 
      color: #ffd700; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
      font-size: 2.8em;
    }
    p { font-size: 1.3em; margin: 20px 0; }
    button {
      font-size: 22px;
      padding: 16px 40px;
      margin: 12px;
      background: #ff6b6b;
      border: none;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover { 
      background: #ff8e8e; 
      transform: scale(1.08); 
    }
    #status {
      margin-top: 30px;
      font-size: 1.2em;
      padding: 20px;
      border-radius: 12px;
      min-height: 100px;
      line-height: 1.5;
      background: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <h1>🌟 Stanovisko 3</h1>
  <p>Čoskoro tu bude nová aktivita!</p>
  <p>Zatiaľ si oddýchni a pokračuj na mape.</p>

  <button onclick="returnToMap()">🏠 Späť na mapu</button>

  <div id="status"></div>

  <script>
    function returnToMap() {
      if (confirm("Vrátiť sa na mapu?")) {
        window.location.href = "index.html";
      }
    }
  </script>
</body>
</html>

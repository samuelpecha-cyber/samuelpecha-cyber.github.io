<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 Stanovisko 3 - Angličtina na lúke</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 30px;
      margin: 0;
    }
    h1 { 
      color: #ffd700; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
      font-size: 2.8em;
    }
    p { font-size: 1.2em; margin: 15px 0; }
    .word { font-size: 2em; margin: 20px 0; }
    .images img { width: 120px; margin: 15px; cursor: pointer; transition: transform 0.2s; border-radius: 12px; }
    .images img:hover { transform: scale(1.1); }
    #status { margin-top: 25px; font-size: 1.2em; min-height: 100px; line-height: 1.5; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; }
    button { font-size: 22px; padding: 14px 30px; margin: 12px; background: #ff6b6b; border: none; border-radius: 20px; color: white; cursor: pointer; transition: all 0.3s; }
    button:hover { background: #ff8e8e; transform: scale(1.08); }
    button:disabled { background: #666; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>
  <h1>🌟 Stanovisko 3</h1>
  <p>Hraj mini-hry a nauč sa angličtinu hravo! 🍎🐶🌈</p>

  <div>
    <button onclick="startMiniGame('fruit')">🍎 Hra: Ovocie</button>
    <button onclick="startMiniGame('animals')">🐶 Hra: Zvieratá</button>
    <button onclick="startMiniGame('colors')">🌈 Hra: Farby</button>
  </div>

  <div id="gameArea"></div>
  <div id="status"></div>
  <button onclick="returnToMap()">🏠 Späť na mapu</button>

  <script>
    "use strict";

    const API = "https://script.google.com/macros/s/AKfycbx0t_2q7ohFvF4ZvTDEGEklEP6kNf5tFkAL89rb9ug2A5CV_a7XVMoOTyKeGjBNqjTY/exec";
    const gameArea = document.getElementById('gameArea');
    const statusEl = document.getElementById('status');

    const gameData = {
      fruit: [
        {word:"Apple", hint:"🍎 Toto ovocie je červené a sladké", images:[
          {src:"https://images.pexels.com/photos/39803/pexels-photo-39803.jpeg", correct:true, alt:"Apple"},
          {src:"https://dinoanimals.com/wp-content/uploads/2023/03/Domestic-cat-32.jpg", correct:false, alt:"Cat"},
          {src:"https://www.lindsaybaca.com/wp-content/uploads/2019/11/Kevin_21_8x12-1.jpg", correct:false, alt:"Dog"}
        ]},
        {word:"Banana", hint:"🍌 Toto ovocie je dlhé a žlté", images:[
          {src:"https://cdn.pixabay.com/photo/2018/06/18/16/05/bananas-3488531_1280.jpg", correct:true, alt:"Banana"},
          {src:"https://cdn.pixabay.com/photo/2017/03/28/12/10/cat-2182904_1280.jpg", correct:false, alt:"Cat"},
          {src:"https://cdn.pixabay.com/photo/2016/11/29/05/08/dog-1861837_1280.jpg", correct:false, alt:"Dog"}
        ]}
      ],
      animals: [
        {word:"Dog", hint:"🐶 Toto zviera šteká", images:[
          {src:"https://cdn.britannica.com/25/234625-050-6070814C/Border-Collie-dog.jpg", correct:true, alt:"Dog"},
          {src:"https://science4fun.info/wp-content/uploads/2017/05/cat.jpg", correct:false, alt:"Cat"},
          {src:"http://noshamsters.be/hamsteropedia/wp-content/uploads/2012/01/DSC06671-copy-copy.jpg", correct:false, alt:"Hamster"}
        ]},
        {word:"Cat", hint:"🐱 Toto zviera mňauká", images:[
          {src:"https://science4fun.info/wp-content/uploads/2017/05/cat.jpg", correct:true, alt:"Cat"},
          {src:"https://cdn.britannica.com/25/234625-050-6070814C/Border-Collie-dog.jpg", correct:false, alt:"Dog"},
          {src:"https://cdn.pixabay.com/photo/2016/11/29/05/08/dog-1861837_1280.jpg", correct:false, alt:"Dog"}
        ]}
      ],
      colors: [
        {word:"Red", hint:"🔴 Farba jablka", images:[
          {src:"https://www.solidbackgrounds.com/images/3840x2160/3840x2160-dark-red-solid-color-background.jpg", correct:true, alt:"Red"},
          {src:"https://www.solidbackgrounds.com/images/2560x1440/2560x1440-blue-solid-color-background.jpg", correct:false, alt:"Blue"},
          {src:"http://getwallpapers.com/wallpaper/full/c/1/f/108144.jpg", correct:false, alt:"Green"}
        ]},
        {word:"Blue", hint:"🔵 Farba oblohy", images:[
          {src:"https://www.solidbackgrounds.com/images/2560x1440/2560x1440-blue-solid-color-background.jpg", correct:true, alt:"Blue"},
          {src:"https://www.solidbackgrounds.com/images/3840x2160/3840x2160-dark-red-solid-color-background.jpg", correct:false, alt:"Red"},
          {src:"http://getwallpapers.com/wallpaper/full/c/1/f/108144.jpg", correct:false, alt:"Green"}
        ]}
      ]
    };

    let currentGame = [];
    let currentQuestion = 0;
    let score = 0;

    function startMiniGame(name) {
      currentGame = gameData[name];
      currentQuestion = 0;
      score = 0;
      showQuestion();
      statusEl.innerHTML = "";
    }

    function showQuestion() {
      if(currentQuestion >= currentGame.length){
        statusEl.innerHTML = `🎉 Hotovo! Správne odpovede: ${score}/${currentGame.length}`;
        finishStation(score);
        gameArea.innerHTML = "";
        return;
      }
      const q = currentGame[currentQuestion];
      gameArea.innerHTML = `
        <p class="word">Slovo: <strong>${q.word}</strong></p>
        <p>Nápoveda: ${q.hint}</p>
        <div class="images">
          ${q.images.map(img=>`<img src="${img.src}" alt="${img.alt}" onclick="checkAnswer(this, ${img.correct})">`).join('')}
        </div>
      `;
    }

    function checkAnswer(el, correct){
      if(correct){
        score++;
        el.style.border = "4px solid #10b981";
        statusEl.innerHTML = "✅ Správne!";
      } else {
        el.style.border = "4px solid #ef4444";
        statusEl.innerHTML = "❌ Skús znova! Nápoveda: klikni na obrázok, ktorý zodpovedá slovu.";
        return; // neskáčeme na ďalšiu otázku
      }
      currentQuestion++;
      setTimeout(showQuestion, 1000); // krátka pauza pred ďalšou otázkou
    }

    function returnToMap() {
      if(confirm("Vrátiť sa na mapu?")) {
        window.location.href = "index.html";
      }
    }

    function finishStation(finalScore){
      const stationId = 3;
      let visited = JSON.parse(localStorage.getItem("visitedStations") || "[]");
      if(!Array.isArray(visited)) visited = [];
      if(!visited.includes(stationId)) visited.push(stationId);
      localStorage.setItem("visitedStations", JSON.stringify(visited));

      let playerName = localStorage.getItem("playerName") || prompt("Zadaj svoje meno:", "Hráč") || "Hráč";
      localStorage.setItem("playerName", playerName);
      let playerId = localStorage.getItem("playerId") || "hrac_" + Date.now();
      localStorage.setItem("playerId", playerId);

      const payload = {name: playerName, playerId, station: stationId, score: finalScore || score};
      const url = API + "?" + new URLSearchParams(payload).toString();

      statusEl.innerHTML += "<br>📤 Odosielam dáta...";

      fetch(url, {method:"GET", mode:"no-cors"})
        .then(()=>console.log("Údaje odoslané"))
        .catch(err=>console.error(err));
    }

  </script>
</body>
</html>

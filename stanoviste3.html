<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 Stanovisko 3 - Angličtina pre škôlkarov</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 30px;
      margin: 0;
    }
    h1 { 
      color: #ffd700; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
      font-size: 2.8em;
    }
    p { font-size: 1.2em; margin: 15px 0; }
    .word { font-size: 2em; margin: 20px 0; }
    .images img { width: 120px; margin: 15px; cursor: pointer; transition: transform 0.2s; border-radius: 12px; }
    .images img:hover { transform: scale(1.1); }
    #status { margin-top: 25px; font-size: 1.2em; min-height: 100px; line-height: 1.5; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; }
    button { font-size: 22px; padding: 14px 30px; margin: 12px; background: #ff6b6b; border: none; border-radius: 20px; color: white; cursor: pointer; transition: all 0.3s; }
    button:hover { background: #ff8e8e; transform: scale(1.08); }
    button:disabled { background: #666; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>
  <h1>🌟 Stanovisko 3</h1>
  <p>Hraj mini-hry a nauč sa angličtinu hravo! 🍎🐶🌈</p>

  <div>
    <button onclick="startMiniGame('fruit')">🍎 Hra: Ovocie</button>
    <button onclick="startMiniGame('animals')">🐶 Hra: Zvieratá</button>
    <button onclick="startMiniGame('colors')">🌈 Hra: Farby</button>
  </div>

  <div id="gameArea"></div>
  <div id="status"></div>

  <button onclick="returnToMap()">🏠 Späť na mapu</button>

  <script>
    "use strict";

    const API = "https://script.google.com/macros/s/AKfycbx0t_2q7ohFvF4ZvTDEGEklEP6kNf5tFkAL89rb9ug2A5CV_a7XVMoOTyKeGjBNqjTY/exec";
    const gameArea = document.getElementById('gameArea');
    const statusEl = document.getElementById('status');

    const games = {
      fruit: {
        word: "Apple",
        hint: "🍎 Toto ovocie je červené a sladké",
        images: [
          {src: "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fimages.pexels.com%2Fphotos%2F39803%2Fpexels-photo-39803.jpeg%3Fcs%3Dsrgb%26dl%3Dfood-healthy-apple-39803.jpg%26fm%3Djpg&f=1&nofb=1&ipt=bfd76dd0b1f1a859eb4b8020cc45bc88636e40470e2b3b8bc06e037a738b6740", correct: true, alt: "Apple"},
          {src: "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fdinoanimals.com%2Fwp-content%2Fuploads%2F2023%2F03%2FDomestic-cat-32.jpg&f=1&nofb=1&ipt=04c99b64af7f3bc9582002429dea70d03f8fe2fa57670d388b4e5ca79efa5340", correct: false, alt: "Cat"},
          {src: "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwww.lindsaybaca.com%2Fwp-content%2Fuploads%2F2019%2F11%2FKevin_21_8x12-1.jpg&f=1&nofb=1&ipt=1d1e18cb3e4af2c2f36ae188a31c2b67a74e4652f40d939d3e962139a1601052", correct: false, alt: "Dog"}
        ]
      },
      animals: {
        word: "Dog",
        hint: "🐶 Toto zviera šteká",
        images: [
          {src: "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fcdn.britannica.com%2F25%2F234625-050-6070814C%2FBorder-Collie-dog.jpg&f=1&nofb=1&ipt=69d65fe63b2fa48eb704e8b0381b48bd342b9b7f5f64bce6aacb7ec952aafcd4", correct: true, alt: "Dog"},
          {src: "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fscience4fun.info%2Fwp-content%2Fuploads%2F2017%2F05%2Fcat.jpg&f=1&nofb=1&ipt=1fe061c935f7954b67b3e023d4eba95cd5353700230d57fff350e95e28d13e15", correct: false, alt: "Cat"},
          {src: "https://external-content.duckduckgo.com/iu/?u=http%3A%2F%2Fnoshamsters.be%2Fhamsteropedia%2Fwp-content%2Fuploads%2F2012%2F01%2FDSC06671-copy-copy.jpg&f=1&nofb=1&ipt=4bdc60cfa60dcef56342b37b5f02d9b3ed76984c8158b35b386dfa75597c31a4", correct: false, alt: "Apple"}
        ]
      },
      colors: {
        word: "Red",
        hint: "🔴 Farba jablka",
        images: [
          {src: "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwww.solidbackgrounds.com%2Fimages%2F3840x2160%2F3840x2160-dark-red-solid-color-background.jpg&f=1&nofb=1&ipt=751f258f2714991e7c9e34bf9a1cc58344be75409be47c83225f2640468c247f", correct: true, alt: "Red"},
          {src: "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwww.solidbackgrounds.com%2Fimages%2F2560x1440%2F2560x1440-blue-solid-color-background.jpg&f=1&nofb=1&ipt=6ddeea4575dafc04a32d0c58552156dad932fb0894e7fb713fe9c3998166a3cc", correct: false, alt: "Blue"},
          {src: "https://external-content.duckduckgo.com/iu/?u=http%3A%2F%2Fgetwallpapers.com%2Fwallpaper%2Ffull%2Fc%2F1%2Ff%2F108144.jpg&f=1&nofb=1&ipt=30524ef9ecfde6e2401cb8aa54ba3549328488deb4eabefdb97ae7a4d7c764fb", correct: false, alt: "Green"}
        ]
      }
    };

    function startMiniGame(name) {
      const game = games[name];
      if (!game) return;

      gameArea.innerHTML = `
        <p class="word">Slovo: <strong>${game.word}</strong></p>
        <p>Nápoveda: ${game.hint}</p>
        <div class="images">
          ${game.images.map(img => `<img src="${img.src}" alt="${img.alt}" onclick="checkAnswer(this, ${img.correct})">`).join('')}
        </div>
      `;
      statusEl.innerHTML = "";
    }

    function checkAnswer(el, correct){
      if(correct){
        statusEl.innerHTML = "✅ Správne! Úloha dokončená!";
        el.style.border = "4px solid #10b981";
        finishStation();
      } else {
        statusEl.innerHTML = "❌ Skús znova! Nápoveda: klikni na obrázok, ktorý zodpovedá slovu.";
        el.style.border = "4px solid #ef4444";
      }
    }

    function returnToMap() {
      if(confirm("Vrátiť sa na mapu?")) {
        window.location.href = "index.html";
      }
    }

    // tu môžeš vložiť tvoju existujúcu finishStation() funkciu
    function finishStation() {
      const stationId = 3;
      let visited = JSON.parse(localStorage.getItem("visitedStations") || "[]");
      if(!Array.isArray(visited)) visited = [];
      if(!visited.includes(stationId)) visited.push(stationId);
      localStorage.setItem("visitedStations", JSON.stringify(visited));

      let playerName = localStorage.getItem("playerName") || prompt("Zadaj svoje meno:", "Hráč") || "Hráč";
      localStorage.setItem("playerName", playerName);
      let playerId = localStorage.getItem("playerId") || "hrac_" + Date.now();
      localStorage.setItem("playerId", playerId);

      const payload = {name: playerName, playerId, station: stationId, score: visited.length};
      const url = API + "?" + new URLSearchParams(payload).toString();

      statusEl.innerHTML += "<br>📤 Odosielam dáta...";

      fetch(url, {method:"GET", mode:"no-cors"})
        .then(()=>console.log("Údaje odoslané"))
        .catch(err=>console.error(err));
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌈 Duhový vodopad - Stanovisko 8</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(45deg, #ec4899, #8b5cf6, #06b6d4, #10b981);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: white;
      text-align: center;
      padding: 40px;
      margin: 0;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1 { 
      color: #fbbf24; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
      font-size: 2.8em;
    }
    p { font-size: 1.3em; margin: 20px 0; }
    select {
      font-size: 20px;
      padding: 12px;
      margin: 25px 0;
      border-radius: 12px;
      border: 3px solid #fbbf24;
      min-width: 320px;
      background: rgba(255,255,255,0.2);
      color: white;
    }
    button {
      font-size: 22px;
      padding: 16px 40px;
      margin: 12px;
      background: #f59e0b;
      border: none;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover { 
      background: #fbbf24; 
      transform: scale(1.08); 
    }
    button:disabled { 
      background: #666; 
      cursor: not-allowed; 
      transform: none; 
    }
    #status {
      margin-top: 30px;
      font-size: 1.2em;
      padding: 20px;
      border-radius: 12px;
      min-height: 100px;
      line-height: 1.5;
    }
    .success { background: #10b981; }
    .error   { background: #ef4444; }
    .loading { background: #3b82f6; }
  </style>
</head>
<body>
  <h1>🌈 Duhový vodopad</h1>
  <p>Vyber si duhovú výzvu a ukáž, aký si šikovný!</p>

  <select id="gameSelect">
    <option value="https://wordwall.net/resource/35923730/math/koľko">🌈 Duhová matematika / koľko</option>
  </select>

  <br>
  <button onclick="startGame()">🎮 Spustiť duhovú hru</button>
  <br><br>
  <button id="finishBtn" onclick="finishStation()">✅ Dokončil som stanovisko</button>

  <div id="status"></div>

  <script>
    "use strict";

    const API = "https://script.google.com/macros/s/AKfycbx0t_2q7ohFvF4ZvTDEGEklEP6kNf5tFkAL89rb9ug2A5CV_a7XVMoOTyKeGjBNqjTY/exec";

    function startGame() {
      const select = document.getElementById("gameSelect");
      if (!select) return;
      const link = select.value;
      window.open(link, "_blank");
      showStatus("🌈 Duhová hra otvorená v novej karte!<br>Keď dokončíš, vráť sa a klikni nižšie.", "loading");
    }

    function showStatus(msg, className = "") {
      const el = document.getElementById("status");
      if (el) {
        el.innerHTML = msg;
        el.className = className;
      }
    }

    function finishStation() {
      const stationId = 8;
      const statusEl = document.getElementById("status");
      const btn = document.getElementById("finishBtn");
      if (!statusEl || !btn) return;

      // visited ako pole
      let visited = JSON.parse(localStorage.getItem("visitedStations") || "[]");
      if (!Array.isArray(visited)) visited = [];

      if (!visited.includes(stationId)) {
        visited.push(stationId);
        localStorage.setItem("visitedStations", JSON.stringify(visited));
      }

      let playerName = localStorage.getItem("playerName");
      if (!playerName) {
        playerName = prompt("Zadaj svoje meno:", "Hráč") || "Hráč";
        localStorage.setItem("playerName", playerName);
      }

      let playerId = localStorage.getItem("playerId");
      if (!playerId) {
        playerId = "hrac_" + Date.now();
        localStorage.setItem("playerId", playerId);
      }

      const payload = {
        name: playerName,
        playerId: playerId,
        station: stationId,
        score: visited.length
      };

      const url = API + "?" + new URLSearchParams(payload).toString();

      showStatus("🌈 Posielam duhové body do oblakov...", "loading");
      btn.disabled = true;
      btn.textContent = "Odosiela sa...";

      fetch(url, { method: "GET", mode: "no-cors" })
        .then(() => {
          showStatus(
            `✅ VODOPÁD DOKONČENÝ!<br><strong>${playerName}</strong><br>Stanovisko ${stationId} • Navštívené: ${visited.length}`,
            "success"
          );

          localStorage.setItem(`station_${stationId}`, "completed");

          setTimeout(() => {
            if (confirm("Vrátiť sa na mapu?")) {
              window.location.href = "index.html";
            }
            btn.disabled = false;
            btn.textContent = "✅ Dokončil som stanovisko";
          }, 2200);
        })
        .catch(err => {
          console.error("Chyba:", err);
          showStatus(`❌ Chyba pri odosielaní<br>${err.message || "neznáma chyba"}<br>Skús znova (F12 pre viac info)`, "error");
          btn.disabled = false;
          btn.textContent = "✅ Dokončil som stanovisko";
        });
    }
  </script>
</body>
</html>

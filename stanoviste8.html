<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌈 Duhový vodopád - Stanovisko 8</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(45deg, #ec4899, #8b5cf6, #06b6d4, #10b981);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: white;
      text-align: center;
      padding: 40px;
      margin: 0;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1 { 
      color: #fbbf24; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
      font-size: 2.8em;
    }
    p { font-size: 1.3em; margin: 20px 0; }
    .task { font-size: 2.2em; margin: 25px 0; font-weight: bold; }
    .options { display: flex; justify-content: center; gap: 40px; margin: 30px 0; flex-wrap: wrap; }
    .option { 
      width: 180px; height: 180px; 
      cursor: pointer; 
      border-radius: 25px; 
      transition: all 0.3s; 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 5em; 
      border: 5px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.1);
      user-select: none;
    }
    .option:hover { transform: scale(1.1); border-color: white; background: rgba(255,255,255,0.2); }
    .option:active { transform: scale(0.98); }
    .option.correct { border-color: #10b981 !important; background: rgba(16,185,129,0.4); animation: bounce 0.5s; }
    .option.wrong { border-color: #ef4444 !important; background: rgba(239,68,68,0.4); }
    @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-20px); } 60% { transform: translateY(-10px); } }
    #status { margin-top: 25px; font-size: 1.2em; min-height: 100px; line-height: 1.5; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; }
    button { font-size: 22px; padding: 14px 30px; margin: 12px; background: #10b981; border: none; border-radius: 20px; color: white; cursor: pointer; transition: all 0.3s; }
    button:hover { background: #34d399; transform: scale(1.08); }
    button:disabled { background: #666; cursor: not-allowed; transform: none; }
    @media (max-width: 500px) { .options { gap: 20px; } .option { width: 150px; height: 150px; font-size: 4em; } }
  </style>
</head>
<body>
  <h1>🌈 Duhový vodopád</h1>
  <p>Klikni na VÄČŠÍ alebo MENŠÍ predmet podľa úlohy! 🌈🏰🚢🌋</p>

  <div id="gameArea"></div>
  <div id="status"></div>
  <button onclick="returnToMap()">🏠 Späť na mapu</button>

  <script>
    "use strict";

    const API = "https://script.google.com/macros/s/AKfycbx0t_2q7ohFvF4ZvTDEGEklEP6kNf5tFkAL89rb9ug2A5CV_a7XVMoOTyKeGjBNqjTY/exec";
    const gameArea = document.getElementById('gameArea');
    const statusEl = document.getElementById('status');

    // 16 dúhových úloh - LEN 2 možnosti vždy!
    const allTasks = [
      // Domy & budovy (4)
      {task:"🔴 VÄČŠÍ?", opt1:{emoji:"🏰", size:5}, opt2:{emoji:"🏠", size:3}, correct:0, hint:"🏰"},
      {task:"🔵 MENŠÍ?", opt1:{emoji:"🏚️", size:2}, opt2:{emoji:"🏢", size:4}, correct:0, hint:"🏚️"},
      {task:"🔴 VÄČŠÍ?", opt1:{emoji:"🗼", size:5}, opt2:{emoji:"⛪", size:3}, correct:0, hint:"🗼"},
      {task:"🔵 MENŠÍ?", opt1:{emoji:"🏘️", size:2}, opt2:{emoji:"🏛️", size:4}, correct:0, hint:"🏘️"},

      // Doprava (4)
      {task:"🔴 VÄČŠÍ?", opt1:{emoji:"🚢", size:5}, opt2:{emoji:"🚗", size:3}, correct:0, hint:"🚢"},
      {task:"🔵 MENŠÍ?", opt1:{emoji:"🛵", size:1}, opt2:{emoji:"🚐", size:4}, correct:0, hint:"🛵"},
      {task:"🔴 VÄČŠÍ?", opt1:{emoji:"🚁", size:4}, opt2:{emoji:"🚀", size:5}, correct:1, hint:"🚀"},
      {task:"🔵 MENŠÍ?", opt1:{emoji:"🚲", size:2}, opt2:{emoji:"🚌", size:5}, correct:0, hint:"🚲"},

      // Príroda (4)
      {task:"🔴 VÄČŠÍ?", opt1:{emoji:"🌋", size:5}, opt2:{emoji:"🏔️", size:4}, correct:0, hint:"🌋"},
      {task:"🔵 MENŠÍ?", opt1:{emoji:"🌈", size:3}, opt2:{emoji:"🌪️", size:5}, correct:0, hint:"🌈"},
      {task:"🔴 VÄČŠÍ?", opt1:{emoji:"🌊", size:5}, opt2:{emoji:"💧", size:1}, correct:0, hint:"🌊"},
      {task:"🔵 MENŠÍ?", opt1:{emoji:"☀️", size:3}, opt2:{emoji:"🌙", size:4}, correct:0, hint:"☀️"},

      // Zvieratá & jedlo (4)
      {task:"🔴 VÄČŠÍ?", opt1:{emoji:"🐋", size:5}, opt2:{emoji:"🐟", size:2}, correct:0, hint:"🐋"},
      {task:"🔵 MENŠÍ?", opt1:{emoji:"🍓", size:2}, opt2:{emoji:"🍉", size:5}, correct:0, hint:"🍓"},
      {task:"🔴 VÄČŠÍ?", opt1:{emoji:"🦕", size:5}, opt2:{emoji:"🐌", size:1}, correct:0, hint:"🦕"},
      {task:"🔵 MENŠÍ?", opt1:{emoji:"🐜", size:1}, opt2:{emoji:"🦋", size:3}, correct:0, hint:"🐜"}
    ];

    let currentTask = 0;
    let score = 0;

    function startGame() {
      currentTask = 0;
      score = 0;
      showTask();
      statusEl.innerHTML = "🌈 Klikni na správny obrázok podľa úlohy! 👆";
    }

    function showTask() {
      if(currentTask >= allTasks.length) {
        statusEl.innerHTML = `🎉 Dúhový vodopád dokončený! 🌈<br>Správne odpovede: ${score}/${allTasks.length}`;
        gameArea.innerHTML = "";
        finishStation(score);
        return;
      }
      
      const task = allTasks[currentTask];
      gameArea.innerHTML = `
        <div class="task">${task.task}</div>
        <div class="options">
          <div class="option" onclick="checkAnswer(0)" data-index="0">${task.opt1.emoji}</div>
          <div class="option" onclick="checkAnswer(1)" data-index="1">${task.opt2.emoji}</div>
        </div>
        <div style="font-size: 1.5em; margin-top: 15px; opacity: 0.8;">💡 ${task.hint} = správna odpoveď ✨</div>
      `;
    }

    function checkAnswer(selected) {
      const task = allTasks[currentTask];
      const correctOption = document.querySelector('.option[data-index="' + task.correct + '"]');
      const selectedOption = document.querySelector('.option[data-index="' + selected + '"]');
      
      if(selected == task.correct) {
        score++;
        selectedOption.classList.add('correct');
        statusEl.innerHTML = "✅ Výborne! 🌈";
      } else {
        selectedOption.classList.add('wrong');
        correctOption.classList.add('correct');
        statusEl.innerHTML = "❌ Nie, pozri na nápovedu! 💡";
      }
      
      setTimeout(() => {
        document.querySelectorAll('.option').forEach(el => {
          el.classList.remove('correct', 'wrong');
        });
        currentTask++;
        showTask();
      }, 1500);
    }

    function returnToMap() {
      finishStation(score);
      if(confirm("Vrátiť sa na mapu?")) {
        window.location.href = "index.html";
      }
    }

    function finishStation(finalScore){
      const stationId = 8;
      let visited = JSON.parse(localStorage.getItem("visitedStations") || "[]");
      if(!Array.isArray(visited)) visited = [];
      if(!visited.includes(stationId)) visited.push(stationId);
      localStorage.setItem("visitedStations", JSON.stringify(visited));

      let playerName = localStorage.getItem("playerName") || prompt("Zadaj svoje meno:", "Hráč") || "Hráč";
      localStorage.setItem("playerName", playerName);
      let playerId = localStorage.getItem("playerId") || crypto.randomUUID();
      localStorage.setItem("playerId", playerId);

      const payload = {name: playerName, playerId, station: stationId, score: finalScore || score};
      const url = API + "?" + new URLSearchParams(payload).toString();

      statusEl.innerHTML += "<br>📤 Odosielam dáta do Dúhového vodopádu...";

      fetch(url, {method:"GET", mode:"no-cors"})
        .then(()=>console.log("✅ Údaje odoslané - Stanovisko 8"))
        .catch(err=>console.error(err));
    }

    // Automaticky spustí hru
    startGame();
  </script>
</body>
</html>

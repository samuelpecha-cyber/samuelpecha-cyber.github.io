<!DOCTYPE html>
<html lang="sk">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hrad písmen</title>

<style>

body{
font-family:Arial;
background:#1e3a8a;
color:white;
text-align:center;
padding:40px;
}

h1{
color:#fbbf24;
}

select{
font-size:20px;
padding:10px;
margin-top:20px;
border-radius:10px;
}

button{
font-size:20px;
padding:15px 30px;
margin-top:20px;
background:#f59e0b;
border:none;
border-radius:15px;
cursor:pointer;
}

button:hover{
background:#fbbf24;
}

</style>

</head>

<body>

<h1>🏰 Hrad písmen</h1>

<p>Vyber si pexeso.</p>

<select id="gameSelect">

<option value="https://puzzel.org/sk/memory/play?p=-OnYa0O4E3Wyx-2U2_hi">
⚽ Futbalisti
</option>

<option value="https://puzzel.org/sk/memory/play?p=-Onmc_amm9vCRqQerBEZ">
🌸 Kvetinky a zvieratká
</option>

</select>

<br>

<button onclick="startGame()">Spustiť pexeso</button>

<br>

<button onclick="finishStation()">Dokončil som úlohu</button>

<script>

function startGame(){

var link=document.getElementById("gameSelect").value;

window.open(link,"_blank");

}

function finishStation(){

let visited = new Set(JSON.parse(localStorage.getItem("visitedStations") || "[]"));

visited.add("2");

localStorage.setItem("visitedStations", JSON.stringify([...visited]));

window.location.href="index.html";

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏰 Hrad písmen - Stanovisko 2</title>
<style>
body{font-family:Arial;background:#1e3a8a;color:white;text-align:center;padding:40px;}
h1{color:#fbbf24;text-shadow:2px 2px 4px rgba(0,0,0,0.5);}
select{font-size:20px;padding:10px;margin:20px 0;border-radius:10px;border:2px solid #fbbf24;}
button{font-size:20px;padding:15px 30px;margin:10px;background:#f59e0b;border:none;border-radius:15px;cursor:pointer;transition:all 0.3s;}
button:hover{background:#fbbf24;transform:scale(1.05);}
button:disabled{background:#666;cursor:not-allowed;transform:none;}
#status {margin-top:20px;font-size:18px;padding:15px;border-radius:10px;}
.success {background:#10b981;color:white;}
.error {background:#ef4444;color:white;}
.loading {background:#3b82f6;color:white;}
</style>
</head>
<body>

<h1>🏰 Hrad písmen</h1>
<p>Vyber si pexeso stanoviska 2 a dokonči úlohu!</p>

<select id="gameSelect">
<option value="https://puzzel.org/sk/memory/play?p=-OnYa0O4E3Wyx-2U2_hi">⚽ Futbalisti</option>
<option value="https://puzzel.org/sk/memory/play?p=-Onmc_amm9vCRqQerBEZ">🌸 Kvetinky a zvieratká</option>
</select>
<br>
<button onclick="startGame()">🎮 Spustiť pexeso</button>
<br><br>
<button id="finishBtn" onclick="finishStation()">✅ Dokončil som úlohu</button>
<div id="status"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxs5trm3k6z3FV8NDd2WLjkfLd4dqSNAj-1-S9lS7fvqohbSm0iYFPg96BbmwW6JP54/exec";

function startGame(){
    const link = document.getElementById("gameSelect").value;
    window.open(link, "_blank");
    document.getElementById("status").innerHTML = "🕹️ Pexeso otvorené v novej karte. Po dokončení klikni ✅ nižšie!";
    document.getElementById("status").className = "loading";
}

function finishStation(){
    const stationId = 2;
    
    // Počítaj navštívené stanovištia
    let visited = new Set(JSON.parse(localStorage.getItem("visitedStations") || "[]"));
    visited.add(stationId.toString());
    localStorage.setItem("visitedStations", JSON.stringify([...visited]));
    
    // Získaj alebo vytvor hráča
    let playerName = localStorage.getItem("playerName") || prompt("Zadaj svoje meno:", "Hráč");
    let playerId = localStorage.getItem("playerId") || "hrac_" + Date.now();
    
    if(playerName) {
        localStorage.setItem("playerName", playerName);
        localStorage.setItem("playerId", playerId);
    }

    const payload = {
        name: playerName || "Neznámy hráč",
        playerId: playerId,
        station: stationId,
        score: visited.size
    };
    
    const url = API + "?" + new URLSearchParams(payload).toString();
    
    // UI feedback
    const statusEl = document.getElementById("status");
    const finishBtn = document.getElementById("finishBtn");
    
    statusEl.innerHTML = "📤 Odosielam dáta do Google Sheets...";
    statusEl.className = "loading";
    finishBtn.disabled = true;
    finishBtn.textContent = "Odosiela sa...";

    // Odoslanie
    fetch(url, { method: 'GET' })
        .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text();
        })
        .then(data => {
            console.log("✅ ÚSPECH:", data, payload);
            statusEl.innerHTML = `✅ ÚLOHA DOKONČENÁ!<br><strong>${playerName}</strong> - Stanovisko ${stationId}<br>Navštívené: ${visited.size}`;
            statusEl.className = "success";
            
            // Pridaj do visited aj pre istotu
            visited.forEach(id => localStorage.setItem("station_" + id, "completed"));
            
            setTimeout(() => {
                if(confirm("Vrátiť sa na mapu?")) {
                    window.location.href = "index.html";
                }
            }, 2000);
        })
        .catch(error => {
            console.error("❌ CHYBA:", error);
            statusEl.innerHTML = `❌ Chyba: ${error.message}<br>Konzola (F12) má detaily. Skús znova.`;
            statusEl.className = "error";
            finishBtn.disabled = false;
            finishBtn.textContent = "✅ Dokončil som úlohu";
        });
}
</script>

</body>
</html>
